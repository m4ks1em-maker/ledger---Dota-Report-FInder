<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
<title>DotaTraker</title><style>
@font-face{font-family:IT;src:url(build/inter-tight-cyrillic-wght-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:IT;src:url(build/inter-tight-latin-wght-normal.woff2)}
@font-face{font-family:UB;src:url(build/unbounded-cyrillic-wght-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:UB;src:url(build/unbounded-latin-wght-normal.woff2)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:IT,sans-serif;color:#e9eef2;background:radial-gradient(420px 260px at 50% 0%,#ecc96c26,transparent 70%),radial-gradient(500px 300px at 0% 100%,#c2410c26,transparent 70%),#0b0e12;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;-webkit-app-region:drag;user-select:none;border:1px solid #ffffff14;overflow:hidden}
.medal{width:84px;height:84px;border-radius:50%;background:url(build/logo.webp) center/cover;box-shadow:0 0 0 2px #ecc96c66,0 0 40px #ecc96c44;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px #ecc96caa,0 0 60px #ecc96c66}}
h1{font-family:UB;font-size:24px;margin:0;letter-spacing:-.4px}h1 span{color:#ecc96c}
#text{color:#a9b5bf;font-size:13.5px;min-height:18px;text-align:center;max-width:420px;line-height:1.45}
.bar{width:300px;height:5px;border-radius:3px;background:#ffffff12;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c08d2c,#f6d886);transition:width .2s}
.bar.indet i{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.btns{display:flex;gap:8px;-webkit-app-region:no-drag}
button{font:600 13.5px IT;height:38px;padding:0 16px;border-radius:10px;border:1px solid #ffffff1f;background:#ffffff0c;color:#e9eef2;cursor:pointer}
button.gold{background:linear-gradient(180deg,#f6d886,#c08d2c);color:#1a1205;border:0}
button:hover{filter:brightness(1.12)}
.hidden{display:none!important}
#x{position:absolute;top:8px;right:10px;-webkit-app-region:no-drag;background:none;border:0;color:#7f8c97;height:28px;padding:0 8px;font-size:16px}
</style></head><body>
<button id="x" title="Закрыть">✕</button>
<div class="medal"></div>
<h1>Dota<span>Traker</span></h1>
<div id="text">Запускаю…</div>
<div class="bar indet" id="bar"><i></i></div>
<div class="btns hidden" id="first"><button class="gold" id="inst">Установить</button><button id="pick">У меня уже есть DotaTraker</button></div>
<div class="btns hidden" id="err"><button class="gold" id="retry">Ещё раз</button><button id="copy">Скопировать журнал</button></div>
<script>
const $ = (id) => document.getElementById(id);
function show(d) {
  $('text').textContent = d.text || '';
  const bar = $('bar'), first = d.stage === 'first', err = d.stage === 'error';
  $('first').classList.toggle('hidden', !first);
  $('err').classList.toggle('hidden', !err);
  bar.classList.toggle('hidden', first || err);
  if (first) $('text').textContent = 'Первый запуск. Скачать DotaTraker или взять папку, где он у тебя уже стоит — с ключом, матчами и настройками.';
  bar.classList.toggle('indet', !(d.progress >= 0));
  bar.querySelector('i').style.width = d.progress >= 0 ? Math.round(d.progress * 100) + '%' : '';
}
window.dt.on(show);
$('inst').onclick = () => window.dt.install();
$('pick').onclick = async () => { const r = await window.dt.pick(); if (r && r.error) $('text').textContent = r.error; };
$('retry').onclick = () => { show({ stage: 'start', text: 'Запускаю…' }); window.dt.retry(); };
$('copy').onclick = async () => { await navigator.clipboard.writeText(await window.dt.log()); $('copy').textContent = 'Скопировано'; };
$('x').onclick = () => window.dt.quit();
</script></body></html>
